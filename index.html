<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>HC Operation</title>

    <!-- iOS Notch & Input Zoom Fix Styles -->
    <style>
      /* Safe Area padding for iPhone Notch / Dynamic Island */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* Prevent auto zoom-in when tapping search/text inputs in iOS */
      input, select, textarea {
        font-size: 16px !important;
      }
    </style>

    <script>
      (function() {
        try {
          var fetchVal = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                     (Object.getPrototypeOf(window) && Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch'));
          if (!desc || !desc.set || (!desc.writable && !desc.set)) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return fetchVal; },
              set: function(v) { fetchVal = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch property patch:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
